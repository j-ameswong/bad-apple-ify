[project]
name = "bad-apple"
version = "0.1.0"
description = "Make bad apple with any video/image collection!"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "opencv-python>=4.13.0.92",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.4.0",
    "types-tqdm>=4.70.0.20260805",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# main.py lives at the repo root, not in a package.
pythonpath = ["."]

[tool.mypy]
# `uv run mypy` with no arguments checks the pipeline. The tests aren't in
# scope — they'd be 97 mechanical `-> None`s for nothing.
files = ["main.py"]
strict = true

[tool.pyright]
venvPath = "."
venv = ".venv"
