[project]
name = "bad-apple"
version = "0.1.0"
description = "Make bad apple with any video/image collection!"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "opencv-python>=4.13.0.92",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# main.py lives at the repo root, not in a package.
pythonpath = ["."]

[tool.pyright]
venvPath = "."
venv = ".venv"
